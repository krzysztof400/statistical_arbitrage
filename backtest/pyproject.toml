[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "statistical-arbitrage-backtester"
version = "0.1.0"
description = "Deterministic Bybit linear-perpetual backtester"
requires-python = ">=3.11"

[tool.pytest.ini_options]
testpaths = ["tests"]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]
